name: Import original TradeCopy-3 Git history
on:
  push:
    branches:
      - integration/tradecopy-3-full-history
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct authenticated source history bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          shas = ["f5f7ab27c45d0cb3cc20e77110b3f0109f5ea07a","6ea378cbdf2ca5a4fccf9047f6da432800de5ebc","e6de681b10acc05473e9cf940feb787bc702bb41","e870b828096eb31fa5aefaf34e3321a2557b97d8","3c4d16bbb2f08f706b773346d621c4ef5cf88ac7","e77ef8c7dd59cc12219cded20dbc309c0e0cd465","4d47896cd463f31c827b1c8115cc96dd74d43ba1","bf939ac2e9f14ec939cc28581549dfe4086bc1cf","236969c0400bcd82e2f75a8fef22e907aa02c720","363a5c9a2b7fafbbec2be3f6c4567c2c877cdaf7","73498687c0c71fe2b5a5ddbdf4d0b3a1ff66ba6b"]
          pieces=[]
          for sha in shas:
              url="https://api.github.com/repos/PatrykBr/Tradingview-Optimiser/git/blobs/"+sha
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"
              })
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
              if data.get("encoding")!="base64": raise RuntimeError("Unexpected Git blob encoding")
              piece=base64.b64decode(data["content"]).decode("ascii")
              pieces.append(piece)
          encoded="".join(pieces)
          if len(encoded)!=962140: raise RuntimeError("History bundle transfer truncated")
          raw=base64.b64decode(encoded,validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          if digest!="eb10205e1de7422d3ccf062c8f104004945ef6d7fa2eac982d29569ad0afe4a4":
              raise RuntimeError("History bundle SHA-256 mismatch")
          with open("/tmp/tradecopy-history.bundle","wb") as f:f.write(raw)
          print("Verified authenticated historical bundle SHA-256 "+digest)
          PY
      - name: Create verified ancestry-preserving integration commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "integration/tradecopy-3-full-history"
          test "$(git rev-parse origin/main)" = "71f0eb540b2b4ec1edaf33b93900dd8bcd6e9362"
          git bundle verify /tmp/tradecopy-history.bundle
          git fetch /tmp/tradecopy-history.bundle refs/heads/export-tradecopy-main:refs/remotes/imported/main
          test "$(git rev-parse refs/remotes/imported/main)" = "54ecab887f7989fa742a9251f33ea07658c7df75"
          test "$(git rev-list --count refs/remotes/imported/main)" = 564
          test -z "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --allow-unrelated-histories -s ours --no-ff --no-commit refs/remotes/imported/main
          git read-tree --reset -u refs/remotes/imported/main
          git commit -m "chore: import TradeCopy-3 complete history and source"
          git merge-base --is-ancestor 71f0eb540b2b4ec1edaf33b93900dd8bcd6e9362 HEAD
          git merge-base --is-ancestor 54ecab887f7989fa742a9251f33ea07658c7df75 HEAD
          test "$(git show -s --format=%P HEAD | wc -w)" = 2
          git diff --quiet HEAD refs/remotes/imported/main
          git fsck --full --no-reflogs
          git push origin HEAD:refs/heads/integration/tradecopy-3-full-history
          echo "Both original histories retained; review branch updated; main untouched."
