[project]
name = "tradingview-optuna-backend"
version = "0.1.0"
description = "Local Optuna v5 optimisation service for the TradingView optimiser extension"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "optuna==5.0.0",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.1,<3",
  "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.16,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.1,<2",
  "ruff>=0.17.2,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
