[project]
name = "tradingview-optuna-backend"
version = "0.1.0"
description = "Local Optuna v5 optimisation service for the TradingView optimiser extension"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "optuna==5.0.0rc1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
